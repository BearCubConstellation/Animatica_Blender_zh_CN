name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test translation isolation and compatibility
        run: python -m unittest discover -s tests -p 'test_core.py' -v
      - name: Build installable packages
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/build.py --tag "$GITHUB_REF_NAME"
          else
            python tools/build.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Animatica-zh-CN-installable
          path: |
            dist/Animatica_zh_CN.zip
            dist/SHA256SUMS.txt
            dist/安装说明.md
          if-no-files-found: error
      - name: Publish release with installable ZIP
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONED_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Animatica_zh_CN.zip \
            "$VERSIONED_ARCHIVE" \
            dist/SHA256SUMS.txt \
            dist/安装说明.md \
            --verify-tag \
            --title "Animatica 简体中文 $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md \
            --latest
    permissions:
      contents: write
